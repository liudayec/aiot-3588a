name: Sync upstream

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream branch and tags
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/yifengyou/aiot-3588a.git 2>/dev/null || \
            git remote set-url upstream https://github.com/yifengyou/aiot-3588a.git
          git fetch --prune upstream master --tags

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork is already up to date with upstream/master"
          else
            git merge --no-edit upstream/master
          fi

          git push origin HEAD:master
          git push origin --tags

      - name: Refresh upstream release index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_releases.py

      - name: Commit release index
        run: |
          set -euo pipefail
          if git diff --quiet -- UPSTREAM_RELEASES.md; then
            echo "Release index is already up to date"
            exit 0
          fi
          git add UPSTREAM_RELEASES.md
          git commit -m "Update upstream release index"
          git push origin HEAD:master
