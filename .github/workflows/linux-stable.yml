name: linux-stable

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build-image:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - set_vendor: armbian
            set_rootfs: armbian_plucky_gnome_aarch64.rar
          - set_vendor: istoreos
            set_rootfs: istoreos_24.10.5_arm64.rar
          - set_vendor: openwrt
            set_rootfs: openwrt_24.10.5_aarch64.rar
          - set_vendor: ubuntu
            set_rootfs: ubuntu_noble_24.04_arm64.rar
          - set_vendor: openeuler
            set_rootfs: openEuler-25.09-aarch64.rar
          - set_vendor: opencloudos
            set_rootfs: OpenCloudOS-GenericCloud-9.4-20251223.0.aarch64.rar
          - set_vendor: openanolis
            set_rootfs: AnolisOS-23.4-aarch64.rar
          - set_vendor: kali
            set_rootfs: kali-linux-2025.4-cloud-genericcloud-arm64.rar
          - set_vendor: fedora
            set_rootfs: Fedora-Server-Guest-Generic-43-1.6.aarch64.rar
          - set_vendor: debian
            set_rootfs: debian_trixie_13_arm64.rar
          - set_vendor: rockylinux
            set_rootfs: rockylinux_10_aarch64.rar
          - set_vendor: fnos
            set_rootfs: fnos_1.1.19_arm64.rar
          - set_vendor: centos
            set_rootfs: centos_10_aarch64.rar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        id: basic_info
        run: |
          nproc
          uname -a
          cat /etc/*release
          free -h
          mount
          df -h
          cat /proc/cpuinfo
          cat /proc/meminfo

      - name: Create simulated physical disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}"G /mnt/mnt.img
          sudo truncate -s "${root_size}"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner.runner /builder
          df -Th

      - name: Run Image Build in Ubuntu 22.04 container
        working-directory: /builder
        run: |
          pwd
          sudo /bin/cp -a ${{ github.workspace }}/* .
          ls -alh
          sudo docker run --rm \
            --privileged \
            --cap-add SYS_ADMIN \
            -v /dev:/dev \
            -v /builder:/workspace \
            -w /workspace \
            -e set_vendor=${{ matrix.set_vendor }} \
            -e set_rootfs=${{ matrix.set_rootfs }} \
            ubuntu:22.04 \
            bash -c "
              chmod +x /workspace/kdevbuild/linux-stable_image.sh ;
              /workspace/kdevbuild/linux-stable_image.sh
            "

      - name: List build output
        run: |
          ls -alh  /builder/release/*
          md5sum /builder/release/*

      - name: Upload Image to Release
        uses: ncipollo/release-action@main
        with:
          tag: linux-stable
          artifacts: /builder/release/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 固件刷写指引

            * [固件刷写指引](https://github.com/yifengyou/aiot-3588a/blob/master/docs/rom_update_guide.md)

            ## 免责声明

            - **按原样提供**：镜像不作任何保证，使用风险自负
            - **无官方关联**：主板厂家和瑞星微无任何关联、无任何商业关联
            - **安全提示**：请及时更新补丁、修改默认密码、配置防火墙
